name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.25.x', '1.26.x']
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - name: Build from downloaded modules
        run: go build -trimpath ./...
      - name: Test from a fresh process
        run: go test -count=1 ./...

  vet:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...

  race:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - run: go build -trimpath -o dist/cointop${{ matrix.suffix }} .

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module and vendor reproducibility
        env:
          GOFLAGS: -mod=mod
        run: |
          go mod tidy
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.81.0'
          extended: true
      - run: hugo --source docs --minify

  install-smoke:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Install and run production entrypoint
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install .
          "$RUNNER_TEMP/bin/cointop" version
          "$RUNNER_TEMP/bin/cointop" --help
      - name: Exercise production API composition
        run: go test -count=1 -run 'TestAPIHandler(StreamsRESTThroughLogging|ServesMCPThroughLogging)$' ./cmd/commands

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
